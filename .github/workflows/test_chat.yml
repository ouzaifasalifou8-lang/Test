name: Test IA Chatbot
on: [push]

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Télécharger le modèle depuis Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='votre_user/votre_repo', filename='votre_modele.gguf', local_dir='.', token=os.environ['HF_TOKEN'])"
          mv votre_modele.gguf model.gguf

      - name: Installer llama-cpp
        run: sudo apt-get update && sudo apt-get install -y llama-cpp

      - name: Lancer le test de chat
        run: python scripts/chat_test.py
        
